name: Unpack RETURN source

on:
  push:
    paths:
      - "RETURN-AppStoreReady.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Expand source archive into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .return-unpack
          mkdir .return-unpack
          unzip -q RETURN-AppStoreReady.zip -d .return-unpack
          cp -a .return-unpack/ReturnApp/. .
          rm -rf .return-unpack
          rm -f RETURN-AppStoreReady.zip
          rm -rf scripts/__pycache__

      - name: Commit extracted application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extraction changes to commit."
            exit 0
          fi
          git commit -m "Add complete RETURN iOS application source"
          git push
